[package]
name = "voicetext-local"
version = "0.5.8"
description = "Dictado local para Windows"
authors = ["VoiceText Local"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "voicetext_local_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.0.0"
cpal = "=0.17.3"
hound = "3.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
rusqlite = { version = "0.37", features = ["bundled"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
regex = "1.13"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "multipart", "json"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Accessibility"] }
